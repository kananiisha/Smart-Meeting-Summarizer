{% extends "base.html" %}
{% block title %}Register – MeetingAI{% endblock %}

{% block extra_css %}
<style>
  .auth-wrap {
    min-height: calc(100vh - 60px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .auth-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2.5rem;
    width: 100%;
    max-width: 400px;
  }
  .auth-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
    margin-bottom: 0.3rem;
  }
  .auth-sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 2rem; }
  .form-group { margin-bottom: 1.1rem; }
  .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.82rem; color: var(--muted); }
  .auth-footer a { color: var(--accent); text-decoration: none; }
  .btn-block { width: 100%; justify-content: center; margin-top: 0.5rem; padding: 12px; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">Create account</div>
    <div class="auth-sub">Join MeetingAI to start summarizing meetings.</div>

    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="yourname" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min. 8 characters" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account →</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('main.login') }}">Login</a>
    </div>
  </div>
</div>
{% endblock %}
